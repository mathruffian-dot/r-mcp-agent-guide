# ChatGPT Codex CLI — r-stats MCP 設定
# 檔案位置：~/.codex/config.toml （或 trusted 專案內 .codex/config.toml）
# 將 command 換成你的 Rscript 完整路徑。

[mcp_servers.r-stats]
command = "C:/Program Files/R/R-4.6.0/bin/Rscript.exe"
args = ["-e", "options(btw.run_r.enabled=TRUE); mcptools::mcp_server(tools = btw::btw_tools())"]

# 若需要環境變數版啟用，改用：
# [mcp_servers.r-stats.env]
# BTW_RUN_R_ENABLED = "true"

# 設定後重啟 Codex；可用 `codex mcp` 檢視。
